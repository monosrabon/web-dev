<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechyMart - Product Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>TechyMart</h1>
        <p>Your one-stop tech store</p>
    </header>

    <!-- Product Grid Container -->
    <main class="product-container">
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Laptop">
            <h3>Smart Laptop</h3>
            <p>$799</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/headphone.jpg" alt="Headphones">
            <h3>Wireless Headphones</h3>
            <p>$199</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/phone.jpg" alt="Smartphone">
            <h3>Smartphone Pro</h3>
            <p>$999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/camera.jpg" alt="Camera">
            <h3>4K Camera</h3>
            <p>$599</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/smartwatch.jpg" alt="Smartwatch">
            <h3>Smartwatch X</h3>
            <p>$299</p>
            <button>Add to Cart</button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2025 TechyMart. All rights reserved.</p>
    </footer>
</body>
</html>
